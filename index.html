<style>
/* 레이아웃: 화면 전체가 게임. HUD는 안전 영역을 피해 가장자리에, 메뉴는 가운데 과자 판 */
:root{
  --dough:#f6e3c3;      /* 쿠키 반죽: 패널 바탕 */
  --dough-2:#ead0a6;
  --choco:#4a2a1a;      /* 초콜릿: 글자·테두리 */
  --berry:#ff5f9e;      /* 딸기: 강조, 마녀 */
  --mint:#5fd3b8;       /* 민트: 도둑 */
  --candy:#7cc6ff;      /* 사탕(마나) */
  --sky:#ffe6f0;
  --f-display:"Jua","Gowun Dodum",system-ui,sans-serif;
  --f-ui:"Gowun Dodum",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
#rot{position:fixed;inset:0;z-index:99;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:linear-gradient(#ffe3ef,#ffd0e2);color:#4a2a1a;text-align:center;padding:20px}
#rot svg{width:120px;height:120px;animation:rotph 2.4s ease-in-out infinite}#rot b{font:22px var(--f-display)}#rot small{font:14px var(--f-ui)}
@keyframes rotph{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait){#rot{display:flex}}
html,body{word-break:keep-all;overflow-wrap:break-word;height:100%;margin:0;background:#ffd9e8;color:var(--choco);font-family:var(--f-ui);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
#cloakFx{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(ellipse at center,#bfe6ff00 40%,#7cc6ff88 100%)}
#hurtFx{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .4s;background:radial-gradient(ellipse at center,#fff0 45%,#ff9bbd99 100%)}
.hud{position:fixed;inset:0;pointer-events:none}
.panel{background:#fff8eecc;border:2px solid var(--choco);border-radius:14px;box-shadow:0 3px 0 var(--choco)}
.tl{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:calc(10px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:6px;z-index:2}
.hp{width:170px;height:16px;border:2px solid var(--choco);border-radius:10px;background:#fff8ee;overflow:hidden;box-shadow:0 2px 0 var(--choco)}
.hp i{display:block;height:100%;width:100%;background:linear-gradient(#7ee8c8,#3fbf9f);transition:width .25s}
.hp.low i{background:linear-gradient(#ff9bbd,#ff5f9e)}
.lbl{font:14px var(--f-display);color:var(--choco);text-shadow:0 1px 0 #fff;display:flex;gap:6px;align-items:center}
.candies{display:flex;gap:4px}
.candies i{width:16px;height:16px;border-radius:50%;border:2px solid var(--choco);background:#fff8ee}
.candies i.on{background:radial-gradient(circle at 35% 35%,#fff 0 18%,var(--candy) 20%);}
.tc{position:absolute;left:50%;top:calc(8px + env(safe-area-inset-top,0px));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:2px;z-index:2}
#compass{width:40px;height:40px}
.timer{font:20px var(--f-display);font-variant-numeric:tabular-nums;color:var(--choco);text-shadow:0 1px 0 #fff,0 0 6px #fff}
.timer.burn{color:var(--berry)}
.tr{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));display:flex;gap:8px;align-items:flex-start;pointer-events:auto;z-index:2}
.ib{font:18px var(--f-display);background:#fff8ee;border:2px solid var(--choco);color:var(--choco);border-radius:12px;width:40px;height:38px;box-shadow:0 2px 0 var(--choco);cursor:pointer;padding:0}
.ib:focus-visible,.btn:focus-visible,.sk:focus-visible,.card:focus-visible{outline:3px solid var(--berry);outline-offset:2px}
#map{width:124px;height:124px;border-radius:12px;background:#fff8ee;border:2px solid var(--choco);box-shadow:0 2px 0 var(--choco);cursor:pointer;display:block}
#map.hidden-map{filter:blur(6px) saturate(.2)}
#bigmap{position:fixed;inset:0;display:grid;place-items:center;background:#4a2a1a88;z-index:15;pointer-events:auto}
#bigmap canvas{width:min(86vh,86vw);height:min(86vh,86vw);border-radius:16px;border:3px solid var(--choco)}
#toast{position:absolute;left:50%;top:26%;transform:translateX(-50%);font:clamp(18px,4.6vh,26px) var(--f-display);color:#fff;-webkit-text-stroke:5px var(--choco);paint-order:stroke fill;white-space:nowrap;opacity:0;transition:opacity .3s;z-index:3}
#toast.warn{color:#ffd1e3}
#hint{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font:13px var(--f-ui);color:var(--choco);background:#fff8eecc;border-radius:10px;padding:3px 10px;max-width:46vw;text-align:center;z-index:2}
#hint:empty{display:none}
/* 도둑 조작 */
#joy{position:absolute;left:0;bottom:0;width:45%;height:72%;pointer-events:auto;z-index:1}
#stick{box-sizing:border-box;position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:3px solid #4a2a1a55;background:#fff8ee55;display:none}
#stick i{box-sizing:border-box;position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px;border-radius:50%;background:#fff8ee;border:3px solid var(--choco)}
#joyHint{position:absolute;left:calc(40px + env(safe-area-inset-left,0px));bottom:calc(36px + env(safe-area-inset-bottom,0px));width:96px;height:96px;border-radius:50%;border:3px dashed #4a2a1a66;display:grid;place-items:center;font:12px var(--f-display);color:#4a2a1aaa;text-align:center;line-height:1.35;z-index:1}
#look{position:absolute;right:0;top:0;width:55%;height:100%;pointer-events:auto;z-index:1}
.skills{position:absolute;right:max(18px,calc(env(safe-area-inset-right,0px) + 8px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:200px;height:170px;pointer-events:none;z-index:2}
.sk{position:absolute;pointer-events:auto;border-radius:50%;border:3px solid var(--choco);background:#fff8ee;color:var(--choco);display:grid;place-items:center;padding:0;cursor:pointer;touch-action:none;box-shadow:0 3px 0 var(--choco)}
.sk svg{width:50%;height:50%;pointer-events:none}
.sk .cost{position:absolute;z-index:1;bottom:-9px;left:50%;transform:translateX(-50%);background:var(--candy);border:2px solid var(--choco);color:var(--choco);font:12px var(--f-display);border-radius:9px;padding:0 6px;pointer-events:none}
.sk .cd{position:absolute;left:-3px;top:-3px;width:calc(100% + 6px);height:calc(100% + 6px);border-radius:50%;pointer-events:none}
.sk.off{opacity:.5}
.sk.on{background:#dff3ff}
#bDash{right:0;bottom:0;width:88px;height:88px;background:#ffe3ef}
#bDecoy{right:100px;bottom:6px;width:64px;height:64px}
#bCloak{right:30px;bottom:104px;width:64px;height:64px}
/* 마녀 HUD */
.dtl{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:calc(10px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:5px;z-index:2}
#hand{position:absolute;left:50%;bottom:calc(8px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:7px;align-items:flex-end;pointer-events:auto;z-index:2}
#burn{position:absolute;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);font:18px var(--f-display);color:#fff;background:var(--berry);border:2px solid var(--choco);border-radius:12px;padding:2px 12px;z-index:2}
/* 설계 화면 */
.design-bar{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:9px;align-items:stretch;pointer-events:auto;z-index:2;padding:10px;border-radius:20px;background:linear-gradient(#a8693d,#7a4526);border:3px solid var(--choco);box-shadow:0 4px 0 var(--choco)}
.design-bar .btn{min-height:42px;padding:6px 14px;white-space:nowrap}
.ib.back{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:calc(10px + env(safe-area-inset-top,0px));pointer-events:auto;z-index:3}
.design-bar .undo{display:flex;align-items:center;justify-content:center;gap:6px}.design-bar .undo svg{width:20px;height:20px}.design-bar .undo:disabled{opacity:.45;cursor:default}
.tgl{display:flex;align-items:center;justify-content:center;gap:8px;font:16px var(--f-display);color:var(--choco);background:#fff;border:3px solid var(--choco);border-radius:14px;min-height:44px;padding:6px 12px;cursor:pointer;box-shadow:0 3px 0 var(--choco);white-space:nowrap}
.tgl .sw{width:38px;height:22px;border-radius:12px;background:#e3d5c8;border:2px solid var(--choco);position:relative;transition:background .15s}
.tgl .sw i{position:absolute;top:1px;left:1px;width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid var(--choco);transition:left .15s}
.tgl.on{background:#ffe3ef}.tgl.on .sw{background:var(--berry)}.tgl.on .sw i{left:17px}
#hudS.erasing .design-info{border-color:var(--berry);box-shadow:0 0 0 3px #ff5f9e55}.design-bar .seg button{padding:7px 10px}
.design-info{position:absolute;left:40%;top:calc(8px + env(safe-area-inset-top,0px));transform:translateX(-50%);font:15px var(--f-display);background:#fff8eee6;border:2px solid var(--choco);border-radius:12px;padding:5px 14px;z-index:2;text-align:center;white-space:nowrap}
.design-info small{display:block;font:12px var(--f-ui);color:#7a5236}
.seg{display:flex;border:2px solid var(--choco);border-radius:12px;overflow:hidden;box-shadow:0 2px 0 var(--choco)}
.seg button{font:15px var(--f-display);background:#fff8ee;border:0;color:var(--choco);padding:8px 12px;cursor:pointer}
.seg button.on{background:var(--choco);color:#fff8ee}
/* 메뉴 */
.scr{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(10px + env(safe-area-inset-top,0px)) calc(10px + env(safe-area-inset-bottom,0px));background:#ffd9e8cc;z-index:20}
.slab{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;max-width:600px;background:#fff8ee;border:3px solid var(--choco);border-radius:22px;box-shadow:0 6px 0 var(--choco);padding:18px 22px}
.kicker{font:13px var(--f-display);letter-spacing:.12em;color:var(--berry)}
h1{margin:0;font:clamp(38px,10vh,64px)/1 var(--f-display);color:var(--choco);text-wrap:balance}
h1 em{font-style:normal;color:var(--berry)}
.kicker.en{margin-top:-6px;letter-spacing:.24em;color:#c27aa0}
#lobCode{font:clamp(34px,10vh,52px)/1 var(--f-display);letter-spacing:.18em;color:var(--berry);background:#fff;border:3px dashed var(--berry);border-radius:14px;padding:6px 16px 6px 24px;user-select:text;-webkit-user-select:text}
#codeIn{user-select:text;-webkit-user-select:text;font:20px var(--f-display);letter-spacing:.2em;text-transform:uppercase;width:9.5em;text-align:center;border:3px solid var(--choco);border-radius:14px;padding:8px 10px;background:#fff;color:var(--choco);min-height:48px;box-sizing:border-box}
#codeIn:focus-visible{outline:3px solid var(--berry);outline-offset:2px}
h2{margin:0;font:clamp(22px,6vh,30px)/1.2 var(--f-display);color:var(--choco);text-wrap:balance}
.lede{margin:0;font:clamp(14px,3.4vh,16px)/1.6 var(--f-ui);text-wrap:balance}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{font:17px var(--f-display);color:var(--choco);background:#fff;border:3px solid var(--choco);border-radius:14px;padding:10px 20px;min-height:48px;cursor:pointer;box-shadow:0 3px 0 var(--choco)}
.btn.hero{background:var(--mint)}
.btn.devil{background:var(--berry);color:#fff}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--choco)}
.note{font:13px/1.5 var(--f-ui);color:#7a5236}
.rules{text-align:left;font:14px/1.6 var(--f-ui);max-height:58vh;overflow:auto;padding-right:4px}
.rules h3{margin:4px 0;font:16px var(--f-display);color:var(--berry)}
.rules p{margin:0 0 8px}
.rules b{font-weight:700}
.res-big{font:clamp(36px,10vh,58px)/1 var(--f-display);font-variant-numeric:tabular-nums;color:var(--berry)}
.stats{display:grid;grid-template-columns:auto auto;gap:3px 18px;font:14px var(--f-ui);text-align:left}
.stats span:nth-child(odd){color:#7a5236}
#loading .bar{width:220px;height:10px;border:2px solid var(--choco);border-radius:6px;overflow:hidden;background:#fff}
#loading .bar i{display:block;height:100%;width:0;background:var(--berry);transition:width .2s}

/* ===== 메뉴 버튼·캐릭터 ===== */
.title-slab{padding-top:10px}
.duo{display:flex;gap:4px;margin-bottom:-6px}.duo svg{width:clamp(64px,17vh,96px);height:auto;filter:drop-shadow(0 3px 0 #4a2a1a33)}
.menu-row{gap:12px}
.mbtn{display:flex;align-items:center;gap:10px;font:inherit;color:#fff;border:3px solid var(--choco);border-radius:20px;padding:10px 18px 10px 12px;min-height:60px;cursor:pointer;position:relative;
  box-shadow:0 5px 0 var(--choco),inset 0 -6px 0 #0002,inset 0 4px 0 #fff6;transition:transform .08s}
.mbtn::after{content:"";position:absolute;left:14px;right:14px;top:6px;height:8px;border-radius:8px;background:#fff7;pointer-events:none}
.mbtn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--choco),inset 0 -4px 0 #0002}
.mbtn.mint{background:linear-gradient(#7ee8c8,#3fbf9f)}.mbtn.berry{background:linear-gradient(#ff8fbf,#ff4f93)}
.mbtn .mi{width:44px;height:44px;border-radius:14px;background:#fff3;display:grid;place-items:center;flex:none}.mbtn .mi svg{width:38px;height:38px}
.mbtn .mt{white-space:nowrap;display:flex;flex-direction:column;align-items:flex-start;line-height:1.1;text-shadow:0 2px 0 #0003}
.mbtn b{font:clamp(18px,4.8vh,22px) var(--f-display)}.mbtn small{font:12px var(--f-ui);opacity:.95}
.mbtn.small{min-height:48px;padding:8px 20px}.mbtn.small b{font-size:17px}.mbtn.go{padding:8px 34px}
.sbtn{white-space:nowrap;font:16px var(--f-display);color:var(--choco);background:#fff;border:3px solid var(--choco);border-radius:16px;padding:8px 18px;min-height:48px;cursor:pointer;box-shadow:0 4px 0 var(--choco)}
.sbtn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--choco)}
.roles{gap:12px}
.rcard{display:flex;flex-direction:column;align-items:center;gap:2px;width:clamp(160px,31vw,210px);padding:8px 10px 12px;border:3px solid var(--choco);border-radius:22px;cursor:pointer;font:inherit;color:var(--choco);box-shadow:0 5px 0 var(--choco);transition:transform .08s}
.rcard svg{width:clamp(72px,20vh,104px);height:auto}.rcard b{font:20px var(--f-display);white-space:nowrap}.rcard small{font:12.5px var(--f-ui);color:#6b4630;white-space:nowrap}
.rcard.mint{background:linear-gradient(#e4fbf3,#b6eedc)}.rcard.berry{background:linear-gradient(#ffeaf3,#ffc4dc)}
.rcard:active{transform:translateY(3px);box-shadow:0 2px 0 var(--choco)}
.opt{display:flex;flex-direction:column;gap:4px;align-items:center}
#setup .slab{gap:8px;padding-top:12px;padding-bottom:14px}#setup h2{font-size:clamp(20px,5.2vh,26px)}#setup .chips button{padding:3px 8px}.olbl{font:15px var(--f-display);white-space:nowrap}.ohint{font:12.5px var(--f-ui);color:#7a5236}
.chips{display:flex;gap:6px}.chips button{white-space:nowrap;font:17px var(--f-display);color:var(--choco);background:#fff;border:3px solid var(--choco);border-radius:14px;min-width:62px;padding:5px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.05;box-shadow:0 3px 0 var(--choco)}
.chips button small{font:11px var(--f-ui);color:#8a6a50}.chips button.on{background:var(--berry);color:#fff}.chips button.on small{color:#fff}
/* ===== 마녀 카드 판 ===== */
.dtr{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:calc(8px + env(safe-area-inset-top,0px));display:flex;gap:6px;pointer-events:auto;z-index:3}
.tray{position:absolute;right:max(8px,env(safe-area-inset-right,0px));bottom:calc(8px + env(safe-area-inset-bottom,0px));padding:8px;border-radius:20px;background:linear-gradient(#a8693d,#7a4526);border:3px solid var(--choco);box-shadow:0 4px 0 var(--choco),inset 0 3px 0 #ffffff33;pointer-events:auto;z-index:2;display:flex;flex-direction:column;gap:8px}
#hand{position:static;transform:none;left:auto;bottom:auto;display:grid;grid-template-columns:repeat(2,auto);gap:7px}
.card{width:clamp(66px,9.2vw,84px);height:clamp(80px,23vh,104px);border-radius:14px;border:3px solid var(--choco);padding:0;cursor:pointer;position:relative;overflow:hidden;font:inherit;color:#fff;box-shadow:0 3px 0 #2b160b;transition:transform .1s,filter .2s}
.card::before{content:"";position:absolute;inset:3px;border-radius:9px;border:2px solid #ffffff99;pointer-events:none}
.card .art{position:absolute;left:0;right:0;top:6%;height:62%;display:grid;place-items:center}.card .art svg{width:78%;height:100%;filter:drop-shadow(0 3px 0 #0003)}
.card .nm{white-space:nowrap;overflow:hidden;position:absolute;left:0;right:0;bottom:0;padding:3px 2px 4px;background:linear-gradient(#3d9de0dd,#1e6fb3ee);text-shadow:0 1px 0 #0e4f80;font:11.5px var(--f-display);text-align:center;letter-spacing:-.02em}
.card .cost{position:absolute;left:3px;top:3px;width:25px;height:25px;border-radius:50% 50% 50% 8%;transform:rotate(-45deg);background:radial-gradient(circle at 32% 28%,#ffffff 0 8%,#d9f3ff 14%,#5cc2f7 48%,#1f86d6);border:2px solid #1166a8;display:grid;place-items:center;box-shadow:0 0 7px #6cd0ffaa}
.card .cost span{transform:rotate(45deg);font:14px var(--f-display);color:#fff;text-shadow:0 1px 0 #0e4f80,0 0 3px #0e4f80}
.card.na{filter:grayscale(.65) brightness(.8)}.card.na .art{opacity:.75}
.card .lock{position:absolute;inset:0;display:grid;place-items:center;background:#0006;font:15px var(--f-display);color:#fff}
.card.sel{transform:translateY(-6px) scale(1.04);box-shadow:0 0 0 3px #fff,0 0 16px 4px #ffd35f}
.k-mon{background:linear-gradient(#c6a4ff,#7d4ee0)}.k-set{background:linear-gradient(#ff9ec7,#e8407e)}.k-wall{background:linear-gradient(#ffe29a,#e0a145)}.k-tile{background:linear-gradient(#a8f0c0,#2fb36f)}.k-magic{background:linear-gradient(#ffd0a0,#ff8a3d)}
.card .kind{position:absolute;right:4px;top:4px;padding:1px 5px;border-radius:7px;background:#ffffffd9;color:#4a2a1a;font:9.5px var(--f-display);white-space:nowrap}
.choco{display:flex;align-items:center;gap:6px}
.cnum{width:36px;height:36px;flex:none;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d9f3ff,#4ab3f4 45%,#1f6fb8);border:3px solid #0e4f80;display:grid;place-items:center;font:18px var(--f-display);color:#fff;text-shadow:0 1px 0 #0e4f80,0 0 4px #0e4f80;box-shadow:inset 0 2px 0 #ffffff88,0 0 8px #4ab3f488;background:radial-gradient(circle at 32% 28%,#ffffff 0 8%,#d9f3ff 14%,#5cc2f7 48%,#1f86d6)}
.ctube{position:relative;flex:1;height:22px;border-radius:12px;background:linear-gradient(#e3f5ff,#b4e1fb);border:2px solid #1166a8;overflow:hidden;box-shadow:inset 0 2px 5px #000a}
.ctube i{position:absolute;left:0;top:0;bottom:0;width:40%;border-radius:10px;overflow:hidden;background:linear-gradient(#c4ecff,#6cc8f8 40%,#3aa6ef 70%,#1d7fd0);box-shadow:0 0 10px #6cd0ffaa;transition:width .25s linear}
.ctube i::before{content:"";position:absolute;inset:0;background:radial-gradient(circle,#ffffffcc 0 1.6px,transparent 2.2px) 0 0/14px 22px,radial-gradient(circle,#ffffff99 0 1.2px,transparent 1.8px) 7px 9px/18px 22px;animation:fizz 1.4s linear infinite}
.ctube i::after{content:"";position:absolute;left:3px;right:3px;top:3px;height:5px;border-radius:5px;background:#ffffff77}
@keyframes fizz{from{background-position:0 22px,7px 31px}to{background-position:0 0,7px 9px}}
.cticks{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 2px),#1166a855 calc(10% - 2px) 10%)}
#dtoast{position:absolute;left:40%;top:28%;transform:translateX(-50%);font:clamp(16px,4.2vh,22px) var(--f-display);color:#fff;-webkit-text-stroke:5px #4a2a1a;paint-order:stroke fill;white-space:nowrap;opacity:0;transition:opacity .3s;z-index:3}
#dtoast.small{font-size:15px;-webkit-text-stroke:4px #4a2a1a}
#dhint{position:absolute;left:40%;top:calc(42px + env(safe-area-inset-top,0px));transform:translateX(-50%);font:13px var(--f-ui);background:#fff8eecc;border-radius:10px;padding:3px 10px;z-index:2;white-space:nowrap}
#dhint:empty{display:none}
/* ===== 도둑 화면 버튼 ===== */
.tl{gap:4px}.hpw{display:flex;align-items:center;gap:4px}.hpw svg{width:26px;height:26px;filter:drop-shadow(0 2px 0 #4a2a1a55)}
.hp{width:160px;height:18px;border:3px solid var(--choco);border-radius:12px;background:#fff8ee;box-shadow:0 2px 0 var(--choco)}
.hp i{background:repeating-linear-gradient(-45deg,#7ee8c8 0 8px,#5fd3b8 8px 16px);border-radius:8px}.hp.low i{background:repeating-linear-gradient(-45deg,#ff9bbd 0 8px,#ff6f9e 8px 16px)}
.candies{display:flex;gap:2px;margin-left:30px}.candies i{width:28px;height:18px;border:0;border-radius:0;background:none;color:#e9dccf;display:block}.candies i svg{width:100%;height:100%;display:block}
.candies i.on{background:none;color:#ff7eb6}.candies i.on:nth-child(2n){color:#7cc6ff}.candies i.on:nth-child(3n){color:#ffd35f}
.ib{width:42px;height:42px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ffe3ef);border:3px solid var(--choco);color:var(--choco);box-shadow:0 3px 0 var(--choco);display:grid;place-items:center}
.ib svg{width:20px;height:20px}.ib:active{transform:translateY(2px);box-shadow:0 1px 0 var(--choco)}
#map{border:4px solid #8a5530;border-radius:16px;box-shadow:0 3px 0 var(--choco),inset 0 0 0 2px #fff}
.timer{background:#fff8eee6;border:3px solid var(--choco);border-radius:14px;padding:0 10px;box-shadow:0 2px 0 var(--choco);text-shadow:none}
.skills{width:230px;height:190px}
.sk{border:3px solid var(--choco);box-shadow:0 4px 0 var(--choco),inset 0 -5px 0 #0002,inset 0 4px 0 #fff7;color:#fff}
.sk::after{content:"";position:absolute;left:22%;right:22%;top:9%;height:12%;border-radius:10px;background:#ffffff66;pointer-events:none}
.sk svg{width:46%;height:46%;margin-top:-24%}
.sk .lb{position:absolute;bottom:11%;left:0;right:0;text-align:center;font:13px var(--f-display);color:#fff;text-shadow:0 1px 0 #0005;pointer-events:none;white-space:nowrap}
.sk .cost{bottom:-10px;display:flex;align-items:center;gap:2px;background:#fff;color:var(--choco);padding:0 7px 0 4px;font:13px var(--f-display);border-radius:10px;white-space:nowrap}
.sk .cost i{width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff 0 18%,#ff7eb6 22%);border:1.5px solid var(--choco)}
.sk:active{transform:translateY(3px);box-shadow:0 1px 0 var(--choco)}
#bDash{width:98px;height:98px;background:linear-gradient(#ff9ec7,#ff4f93)}#bDash .lb{font-size:15px}#bDash svg{width:52%;height:52%}
#bDecoy{right:112px;bottom:4px;width:74px;height:74px;background:linear-gradient(#8ff0d2,#2fbf93)}
#bCloak{right:34px;bottom:112px;width:74px;height:74px;background:linear-gradient(#cdb6ff,#8a63e8)}
.sk.off{filter:grayscale(.75) brightness(.9);opacity:.85}.sk.on{box-shadow:0 0 0 4px #fff,0 0 18px 6px #b98cff}
/* ===== 결과 화면 ===== */
.res-slab{gap:8px;padding-top:6px;min-width:min(520px,90vw)}
.res-rib{font:clamp(26px,7.5vh,38px) var(--f-display);color:#fff;background:linear-gradient(#ff8fbf,#ff4f93);border:3px solid var(--choco);border-radius:16px;padding:4px 26px;box-shadow:0 4px 0 var(--choco);margin-top:-26px;white-space:nowrap;text-shadow:0 2px 0 #0003}
.res-rib.lose{background:linear-gradient(#cdb6ff,#8a63e8)}
.res-who{display:flex;align-items:center;gap:12px}.res-who svg{width:clamp(70px,20vh,100px);height:auto}
.res-big{font:clamp(40px,12vh,64px)/1 var(--f-display);color:var(--choco);text-shadow:0 3px 0 #ffd6e6}
.res-lede{font:clamp(15px,3.8vh,18px) var(--f-display);color:#7a5236;margin:0}

  if(s.d){if(!G.decoy){const m=makeChar('hero',1.85);addRing(m);scene.add(m.g);play(m,'Running_A');G.decoy={x:s.d[0],z:s.d[1],face:s.d[2],m}}const dc=G.decoy;dc.tx=s.d[0];dc.tz=s.d[1];dc.tface=s.d[2];dc.moving=!!s.d[3]}else if(G.decoy){scene.remove(G.decoy.m.g);G.decoy=null}
  const seen=new Set();for(const a of s.e){const[id,tc,x,z,f,st]=a;seen.add(id);let e=G.ents.find(q=>q.id===id);if(!e){const ty=CTYPE[tc];e=TRAPS.includes(ty)?spawnTrap(ty,x,z):ty==='skel'?spawnSkel(x,z):ty==='ginger'?spawnGinger(x,z):ty==='tower'?spawnTower(x,z):ty==='jelly'?spawnJelly(x,z):spawnBell(x,z);e.id=id}e.tx=x;e.tz=z;e.tf=f;e.st=st}
  for(let i=G.ents.length-1;i>=0;i--)if(!seen.has(G.ents[i].id)){scene.remove(G.ents[i].g);G.ents.splice(i,1)}
  const ps=new Set();for(const[id,x,z,vx,vz]of s.p){ps.add(id);let q=G.projs.find(o=>o.id===id);if(!q){const g=arrowMesh();g.lookAt(vx,0,vz);g.position.set(x,1.4,z);scene.add(g);q={id,g,x,z};G.projs.push(q);SFX.pew()}q.x=x;q.z=z;q.vx=vx;q.vz=vz}
  for(let i=G.projs.length-1;i>=0;i--)if(!ps.has(G.projs[i].id)){scene.remove(G.projs[i].g);G.projs.splice(i,1)}
  const gs=new Set();for(const[id,x,z,k]of s.g){gs.add(id);let q=G.sigils.find(o=>o.id===id);if(!q){sigil(x,z,1,()=>{});q=G.sigils[G.sigils.length-1];q.id=id}q.k=k}
  for(let i=G.sigils.length-1;i>=0;i--)if(!gs.has(G.sigils[i].id)){scene.remove(G.sigils[i].m);G.sigils.splice(i,1)}
  if(s.c){for(const c of G.candies)scene.remove(c.g);G.candies=[];for(const[x,z,f]of s.c)addCandy(x,z,!!f)}
  if(s.w)mirrorWalls(s.w);
  for(const ev of s.ev||[]){if(ev==='fake'){SFX.pop();say('도둑이 가짜 사탕을 먹었어요!',false,1.5)}else if(ev.startsWith('trap:')){const k=ev.slice(5);say(k==='slip'?'도둑이 미끄러졌어요':k==='rev'?'도둑의 방향이 거꾸로 됐어요':'도둑이 젤리 덫에 걸렸어요',false,1.4);SFX.squish()}else if(ev.startsWith('burst:')){const[,x,z,ty]=ev.split(':');burstFx(+x,+z,ty);G.stats.decoyFooled++;say(`분신에 속아 ${ty==='ginger'?'인간쿠키가':'슬라임이'} 터졌어요`,false,1.5);const me=G.ents.find(q=>isMon(q)&&Math.hypot(q.x-x,q.z-z)<2.5);if(me)me.g.visible=false}else if(ev==='pop'){SFX.pop();G.stats.decoyFooled++;say('펑! 분신이었어요',false,1.4)}else if(ev==='bell'){SFX.bell();G.stats.bells++;say('🔔 딸랑! 인간쿠키 출동',false,1.4)}else if(ev==='hit'){SFX.bonk();say('도둑이 맞았어요!',false,1)}else if(ev==='gum'){SFX.squish();say('🫧 도둑이 껌을 밟았어요',false,1)}}}
function mirrorWalls(list){if(B.walls.length!==list.length){B.walls=list.map(([o,x,z])=>({o,x,z}));rebuildEdges();FIELD.clear();syncWallMeshes();rebuildPathLines();return}
  let ch=false;list.forEach(([o,x,z],i)=>{const w=B.walls[i];if(w.o!==o||w.x!==x||w.z!==z){const from={o:w.o,x:w.x,z:w.z};w.o=o;w.x=x;w.z=z;w.anim={t:0,from};w.prev={x:from.x,z:from.z};w.lockUntil=G.t+WALL_LOCK;G.devil.lastMove=G.t;ch=true}});
  if(ch){rebuildEdges();syncPosts();SFX.crunch();rebuildPathLines()}}
const angLerp=(a,b,t)=>{let d=((b-a+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;return a+d*t};
function mirrorUpdate(dt){G.t+=dt;G.mapFog=Math.max(0,G.mapFog-dt);const k=Math.min(1,dt*12),h=G.hero;
  if(h.tx!==undefined){h.x=lerp(h.x,h.tx,k);h.z=lerp(h.z,h.tz,k);h.face=angLerp(h.face,h.tface,k)}h.m.g.position.set(h.x,0,h.z);h.m.g.rotation.y=h.face;h.m.g.visible=!!h.vis;play(h.m,h.moving?'Running_A':'Idle');h.m.mixer.update(dt);
  const dc=G.decoy;if(dc){dc.x=lerp(dc.x,dc.tx,k);dc.z=lerp(dc.z,dc.tz,k);dc.face=angLerp(dc.face,dc.tface,k);dc.m.g.position.set(dc.x,0,dc.z);dc.m.g.rotation.y=dc.face;play(dc.m,dc.moving?'Running_A':'Idle');dc.m.mixer.update(dt)}
  for(const e of G.ents){if(e.tx===undefined)continue;e.x=lerp(e.x,e.tx,k);e.z=lerp(e.z,e.tz,k);
    if(isMon(e)){if(e.m.state!==e.st){e.m.state=e.st;e.m.t=0}e.face=angLerp(e.face||0,e.tf,k);e.g.position.set(e.x,0,e.z);e.g.rotation.y=e.face;e.m.mixer.update(dt)}
    else if(e.type==='tower'){e.g.rotation.y=angLerp(e.g.rotation.y,e.tf,k);e.head.scale.setScalar(1+e.st*.4)}
    else if(e.type==='jelly'){const o=Math.min(1,e.st/2);for(const m of e.mats)m.opacity=o;e.ph+=dt*2;e.bubbles.forEach((b,i)=>b.scale.setScalar(1+Math.sin(e.ph+i*1.7)*.18))}
    else if(e.type==='bell'&&e.st){e.bell.rotation.z=Math.sin(G.t*30)*.4}}
  for(const q of G.projs){q.x+=(q.vx||0)*dt;q.z+=(q.vz||0)*dt;q.g.position.set(q.x,1.4,q.z)}
  for(const q of G.sigils){q.m.material.opacity=Math.min(.85,q.k||0);q.m.rotation.z+=dt}
  for(const c of G.candies){c.ph+=dt*2;c.g.position.y=1+Math.sin(c.ph)*.18;c.g.rotation.y+=dt}
  updWallAnim(dt);updFx(dt)}
